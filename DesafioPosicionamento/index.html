<!DOCTYPE html>
<html lang="en">
<head>

    <title>Flexbox</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <div class="box">
        <div class="space-between">

            <img src="img/icone-fantasma.png" alt="">
            <img src="img/icone-hipopotamo.png" alt="">

            <img src="img/icone-fantasma.png" alt="">

        <div class="space-between">

                <img src="img/icone-fantasma.png" alt="">

            </div>

        </div>

            <div class="flex-start">

                <img src="img/icone-hipopotamo.png" alt="">
            </div>
        </div>

                <img src="img/icone-bicicleta.png" alt="">
                <div class="flex-end">
                    <img src="img/icone-bicicleta.png" alt="">
                    <img src="img/icone-fantasma.png" alt="">

            <div class="space-between">
                <div class="center">
                    <img src="img/icone-fantasma.png" alt="">

                <div class="center">
